Alias /estagio /home/luis/html/dbestagio
<Directory /home/luis/html/dbestagio>
    # Sem Indexes: a listagem de diretorios expunha os scripts de administracao
    # e do curso, permitindo enumera-los sem precisar adivinhar os nomes.
    # Sem MultiViews: o conf implantado em /etc/apache2/conf-available/ nunca a
    # teve, entao a negociacao de conteudo sempre esteve desligada neste
    # servidor. Habilita-la mudaria a resolucao de URLs sem extensao.
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
